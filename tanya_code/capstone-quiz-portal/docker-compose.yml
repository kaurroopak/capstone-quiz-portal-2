version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quiz-portal-postgres
    restart: always
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quiz-portal-redis
    restart: always
    ports:
      - '6389:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
